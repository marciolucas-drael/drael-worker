services:
  - type: web
    name: drael-worker
    runtime: python
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: poetry install --only main --no-ansi
    startCommand: poetry run uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NTFY_TOPIC
        value: SET_IN_RENDER_ENV
      - key: AUTH_TOKEN
        value: SET_IN_RENDER_ENV
      - key: MCP_TOKEN
        value: SET_IN_RENDER_ENV
